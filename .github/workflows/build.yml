name: Build

on:
push:
branches: [master, main]
tags: ['v*']
pull_request:
branches: [master, main]
workflow_dispatch:

permissions:
contents: write
actions: read

jobs:
build-lkms:
name: LKMs / ${{ matrix.kmi }}
runs-on: ubuntu-latest

strategy:
  fail-fast: false
  matrix:
    kmi:
      - android12-5.10
      - android13-5.10
      - android13-5.15
      - android14-5.15
      - android14-6.1
      - android15-6.6
      - android16-6.12
      - android17-6.18

container:
  image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
  options: --privileged

steps:
  - name: Checkout source
    uses: actions/checkout@v7

  - name: Build dfroot.ko
    shell: bash
    run: |
      set -euo pipefail

      cd lkm
      make -j"$(nproc)"

      llvm-objcopy --strip-unneeded \
        -R .comment \
        -R .note.gnu.build-id \
        -R .note.gnu.property \
        -R .note.Linux \
        -R .note.GNU-stack \
        -R .BTF \
        -R .BTF.base \
        -R .llvm_addrsig \
        -R .hyp.text \
        -R .hyp.bss \
        -R .hyp.rodata \
        -R .hyp.event_ids \
        -R .hyp.patchable_function_entries \
        -R .hyp.data \
        dfroot.ko

      mkdir -p "$GITHUB_WORKSPACE/out"
      cp dfroot.ko "$GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko"

      make clean

  - name: Upload LKM
    uses: actions/upload-artifact@v7
    with:
      name: df-lkm-${{ matrix.kmi }}
      path: out/dfroot-${{ matrix.kmi }}.ko
      if-no-files-found: error
      retention-days: 14

build-dfroot:
name: Build DFRoot APK
needs: build-lkms
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v7

  - name: Configure release signing
    if: github.event_name != 'pull_request'
    shell: bash
    env:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    run: |
      set -euo pipefail

      mkdir -p keys

      if [[ -n "$KEYSTORE" && \
            -n "$KEYSTORE_PASSWORD" && \
            -n "$KEY_ALIAS" && \
            -n "$KEY_PASSWORD" ]]; then

        echo "$KEYSTORE" | base64 --decode > keystore.jks

        {
          echo "KEYSTORE_FILE=../keystore.jks"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          echo "KEY_ALIAS=$KEY_ALIAS"
          echo "KEY_PASSWORD=$KEY_PASSWORD"
        } > signing.properties

        echo "Using configured release signing key."

      elif [[ -f keys/testkey.jks ]]; then

        {
          echo "KEYSTORE_FILE=../keys/testkey.jks"
          echo "KEYSTORE_PASSWORD=android"
          echo "KEY_ALIAS=androiddebugkey"
          echo "KEY_PASSWORD=android"
        } > signing.properties

        echo "::warning::Using generic test signing key."

      else
        echo "::error::No release signing secrets or fallback keystore found."
        echo "::error::Provide all four signing secrets or add keys/testkey.jks."
        exit 1
      fi

  - name: Download all LKMs
    uses: actions/download-artifact@v7
    with:
      pattern: df-lkm-*
      merge-multiple: true
      path: app/src/main/jni/ko/

  - name: Verify downloaded LKMs
    shell: bash
    run: |
      set -euo pipefail

      for kmi in \
        android12-5.10 \
        android13-5.10 \
        android13-5.15 \
        android14-5.15 \
        android14-6.1 \
        android15-6.6 \
        android16-6.12 \
        android17-6.18
      do
        test -s "app/src/main/jni/ko/dfroot-${kmi}.ko" || {
          echo "::error::Missing LKM for ${kmi}"
          exit 1
        }
      done

  - name: Set up Java
    uses: actions/setup-java@v6
    with:
      distribution: temurin
      java-version: '21'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v6

  - name: Build debug APK
    if: github.event_name == 'pull_request'
    run: ./gradlew :app:assembleDebug

  - name: Build release APK
    if: github.event_name != 'pull_request'
    run: ./gradlew :app:assembleRelease

  - name: Upload DFRoot APK
    uses: actions/upload-artifact@v7
    with:
      name: DFRoot-${{ github.event_name == 'pull_request' && 'debug' || 'release' }}
      path: |
        app/build/outputs/apk/release/DFRoot_*.apk
        app/build/outputs/apk/debug/DFRoot_*.apk
      if-no-files-found: error
      retention-days: 30

  - name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    uses: softprops/action-gh-release@v1
    with:
      files: app/build/outputs/apk/release/DFRoot_*.apk
      fail_on_unmatched_files: true
      generate_release_notes: true
